<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permit2 RPC Manager - Browser Test</title>
    <style>
        body { font-family: sans-serif; padding: 1em; display: flex; gap: 1em;}
        #controls, #output-area { flex: 1; }
        textarea { width: 95%; min-height: 200px; font-family: monospace; margin-bottom: 10px;}
        pre { background-color: #eee; padding: 1em; border-radius: 5px; white-space: pre-wrap; word-wrap: break-word; max-height: 600px; overflow-y: auto;}
        button { margin: 5px 5px 5px 0; padding: 8px 12px; }
        .error { color: red; }
        .success { color: green; }
        .info { color: blue; }
        .debug { color: grey; }
        .log-entry { margin-bottom: 5px; border-bottom: 1px solid #ccc; padding-bottom: 5px; }
    </style>
</head>
<body>
    <div id="controls">
        <h1>Permit2 RPC Manager - Browser Test</h1>
        <p>Open the browser's developer console to see detailed logs.</p>

        <div>
            <label for="rpcWhitelistText">RPC Whitelist Data (Edit to test failover by removing primary RPCs):</label><br>
            <textarea id="rpcWhitelistText"></textarea><br>
            <button id="initButton">Initialize/Re-Initialize Manager</button>
        </div>
        <hr>
        <div>
            <label for="chainIdInput">Chain ID:</label>
            <input type="number" id="chainIdInput" value="100">
            <button id="testButton" disabled>Test Latency & Get Fastest RPC</button>
            <button id="chainIdButton" disabled>Call eth_chainId</button>
            <button id="wxdaiButton" disabled>Check WXDAI Balances (Gnosis)</button>
            <button id="permitSimButton" disabled>Simulate Real Permit Checks (Gnosis)</button> <!-- Updated Button Text -->
        </div>
    </div>

    <div id="output-area">
        <h2>Result / Status Log:</h2>
        <pre id="output">Initialize Manager first...</pre>
    </div>

    <script type="module">
        // Import from the built distribution file
        import { Permit2RpcManager, readContract } from './dist/index.js';
        // Removed direct viem import - define ABIs inline

        const outputEl = document.getElementById('output');
        const initButton = document.getElementById('initButton');
        const testButton = document.getElementById('testButton');
        const chainIdButton = document.getElementById('chainIdButton');
        const wxdaiButton = document.getElementById('wxdaiButton');
        const permitSimButton = document.getElementById('permitSimButton');
        const chainIdInput = document.getElementById('chainIdInput');
        const rpcWhitelistText = document.getElementById('rpcWhitelistText');

        // Constants
        const GNOSIS_CHAIN_ID = 100;
        const WXDAI_ADDRESS = '0xe91D153E0b41518A2Ce8Dd3D7944Fa863463a97d';
        const ADDRESS_ZERO_BALANCE = '0xd9530F3fbBEa11beD01DC09E79318f2f20223716'; // Example address with likely 0 balance
        const ADDRESS_100_BALANCE = '0x054Ec26398549588F3c958719bD17CC1e6E97c3C'; // Example address with known balance
        const EXPECTED_BALANCE_100 = 100001000000000000000n; // 100.001 * 10^18
        const PERMIT2_ADDRESS = '0x000000000022D473030F116dDEE9F6B43aC78BA3';

        // ABIs (Defined inline)
        const erc20AbiBalanceOf = [
          {
            "inputs": [{ "internalType": "address", "name": "owner", "type": "address" }],
            "name": "balanceOf",
            "outputs": [{ "internalType": "uint256", "name": "", "type": "uint256" }],
            "stateMutability": "view",
            "type": "function"
          }
        ];
        const erc20AbiAllowance = [
          {
            "inputs": [
              { "internalType": "address", "name": "owner", "type": "address" },
              { "internalType": "address", "name": "spender", "type": "address" }
            ],
            "name": "allowance",
            "outputs": [{ "internalType": "uint256", "name": "", "type": "uint256" }],
            "stateMutability": "view",
            "type": "function"
          }
        ];
        const permit2AbiNonceBitmap = [
          {
            "inputs": [
              { "internalType": "address", "name": "owner", "type": "address" },
              { "internalType": "uint256", "name": "wordPos", "type": "uint256" }
            ],
            "name": "nonceBitmap",
            "outputs": [{ "internalType": "uint256", "name": "bitmap", "type": "uint256" }],
            "stateMutability": "view",
            "type": "function"
          }
        ];

        let manager = null; // Initialize manager as null

        // Keep track of logs to display on page
        let logs = [];
        function logOutput(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = `[${timestamp}][${type.toUpperCase()}] ${typeof message === 'string' ? message : JSON.stringify(message)}`;
            logs.unshift(logEntry); // Add to beginning
            logs = logs.slice(0, 150); // Keep max 150 logs
            outputEl.textContent = logs.join('\n');
            outputEl.className = type; // Style based on last message type
            // Also log to console
            const consoleMethod = type === 'error' ? 'error' : (type === 'warn' ? 'warn' : 'log');
            console[consoleMethod](message);
        }

        // Function to fetch and load default whitelist
        async function loadDefaultWhitelist() {
            try {
                const response = await fetch('./src/rpc-whitelist.json'); // Fetch relative to HTML
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                rpcWhitelistText.value = JSON.stringify(data, null, 2);
                logOutput("Default rpc-whitelist.json loaded into textarea.", "info");
            } catch (e) {
                logOutput(`Error loading default rpc-whitelist.json: ${e.message}`, "error");
                rpcWhitelistText.value = '{\n  "rpcs": {}\n}'; // Default empty structure
            }
        }

        // Initialize Manager Function
        function initializeManager() {
             logOutput('Initializing Permit2RpcManager with logLevel: debug...');
             let initialRpcData;
             try {
                 initialRpcData = JSON.parse(rpcWhitelistText.value);
                 if (!initialRpcData || typeof initialRpcData !== 'object' || !initialRpcData.rpcs) {
                     throw new Error("Invalid JSON structure. Must have a top-level 'rpcs' object.");
                 }
             } catch (e) {
                  logOutput(`Error parsing JSON from textarea: ${e.message}`, 'error');
                  manager = null; // Ensure manager is null on error
                  testButton.disabled = true;
                  chainIdButton.disabled = true;
                  wxdaiButton.disabled = true;
                  permitSimButton.disabled = true;
                  return;
             }

             try {
                 // Initialize with a shorter cooldown for easier testing observation
                 manager = new Permit2RpcManager({
                     logLevel: 'debug',
                     latencyTimeoutMs: 7000,
                     requestTimeoutMs: 10000,
                     runtimeFailureCooldownMs: 15000, // 15 seconds cooldown for testing
                     initialRpcData: initialRpcData // Pass data from textarea
                 });
                 logOutput('Manager initialized successfully with data from textarea (15s runtime cooldown).', 'success');
                 testButton.disabled = false;
                 chainIdButton.disabled = false;
                 wxdaiButton.disabled = false;
                 permitSimButton.disabled = false;
             } catch (err) {
                 logOutput(`Error initializing manager: ${err.message}`, 'error');
                  manager = null;
                  testButton.disabled = true;
                  chainIdButton.disabled = true;
                  wxdaiButton.disabled = true;
                  permitSimButton.disabled = true;
             }
        }

        // --- Event Listeners ---
        initButton.addEventListener('click', initializeManager);

        testButton.addEventListener('click', async () => {
            if (!manager) return logOutput('Manager not initialized. Click "Initialize Manager" first.', 'error');
            const chainId = parseInt(chainIdInput.value, 10);
            logOutput(`Testing latency for Chain ID: ${chainId}...`);
            try {
                // Clear runtime failures before latency test for clean results
                manager.runtimeFailedRpcMap?.delete(chainId);
                logOutput(`Cleared runtime failure map for chain ${chainId}.`, 'debug');

                const rankedList = await manager.rpcSelector.getRankedRpcList(chainId);
                if (rankedList.length > 0) {
                    logOutput(`Latency test complete. Fastest usable RPC found: ${rankedList[0]}\nFull ranked list:\n${rankedList.join('\n')}`, 'success');
                } else {
                    logOutput(`Latency test complete. No usable RPCs found for chain ${chainId}. Check console for CORS/network errors or whitelist content.`, 'error');
                }
            } catch (err) {
                logOutput(`Error during latency test: ${err.message}`, 'error');
            }
        });

         chainIdButton.addEventListener('click', async () => {
            if (!manager) return logOutput('Manager not initialized. Click "Initialize Manager" first.', 'error');
             const chainId = parseInt(chainIdInput.value, 10);
            logOutput(`Calling eth_chainId for Chain ID: ${chainId}...`);
            try {
                const result = await manager.send(chainId, 'eth_chainId');
                logOutput(`eth_chainId successful. Result: ${result} (Chain ID: ${parseInt(result, 16)})`, 'success');
            } catch (err) {
                logOutput(`Error calling eth_chainId: ${err.message}`, 'error');
            }
        });

        wxdaiButton.addEventListener('click', async () => {
             if (!manager) return logOutput('Manager not initialized. Click "Initialize Manager" first.', 'error');
             logOutput(`Checking WXDAI balances on Gnosis (Chain ${GNOSIS_CHAIN_ID})...`);

             try {
                const results = await Promise.allSettled([
                    readContract({
                        manager,
                        chainId: GNOSIS_CHAIN_ID,
                        address: WXDAI_ADDRESS,
                        abi: erc20AbiBalanceOf,
                        functionName: 'balanceOf',
                        args: [ADDRESS_ZERO_BALANCE],
                        logger: (level, msg, ...params) => logOutput(`[WXDAI:${level}] ${msg} ${params.join(' ')}`, level)
                    }),
                     readContract({
                        manager,
                        chainId: GNOSIS_CHAIN_ID,
                        address: WXDAI_ADDRESS,
                        abi: erc20AbiBalanceOf,
                        functionName: 'balanceOf',
                        args: [ADDRESS_100_BALANCE],
                        logger: (level, msg, ...params) => logOutput(`[WXDAI:${level}] ${msg} ${params.join(' ')}`, level)
                    })
                ]);

                let success = true;
                let summary = 'WXDAI Balance Check Results:\n';

                // Check result for ADDRESS_ZERO_BALANCE
                if (results[0].status === 'fulfilled') {
                    const balance = BigInt(results[0].value);
                    summary += ` - Address ...${ADDRESS_ZERO_BALANCE.slice(-4)}: ${balance === 0n ? 'OK (0)' : `FAIL (Expected 0, Got ${balance})`}\n`;
                    if (balance !== 0n) success = false;
                } else {
                    summary += ` - Address ...${ADDRESS_ZERO_BALANCE.slice(-4)}: FAILED (${results[0].reason?.message || 'Unknown error'})\n`;
                    success = false;
                }

                 // Check result for ADDRESS_100_BALANCE
                if (results[1].status === 'fulfilled') {
                    const balance = BigInt(results[1].value);
                     summary += ` - Address ...${ADDRESS_100_BALANCE.slice(-4)}: ${balance === EXPECTED_BALANCE_100 ? `OK (${balance})` : `FAIL (Expected ${EXPECTED_BALANCE_100}, Got ${balance})`}\n`;
                     if (balance !== EXPECTED_BALANCE_100) success = false;
                } else {
                    summary += ` - Address ...${ADDRESS_100_BALANCE.slice(-4)}: FAILED (${results[1].reason?.message || 'Unknown error'})\n`;
                    success = false;
                }

                logOutput(summary, success ? 'success' : 'error');

             } catch (err) {
                 logOutput(`Error during WXDAI balance check: ${err.message}`, 'error');
             }
        });

        // --- Real Permit Check Simulation ---
        permitSimButton.addEventListener('click', async () => {
            if (!manager) return logOutput('Manager not initialized. Click "Initialize Manager" first.', 'error');

            const permitChainId = 100; // Gnosis
            // Mock Permit Data (structure inferred, values are examples)
            const mockPermits = [
                 { id: 'permit-1', nonce: 0n, owner: ADDRESS_100_BALANCE, tokenAddress: WXDAI_ADDRESS, amount: 50n * (10n**18n) }, // Should have balance/allowance, nonce 0 likely unused
                 { id: 'permit-2', nonce: 1n, owner: ADDRESS_100_BALANCE, tokenAddress: WXDAI_ADDRESS, amount: 60n * (10n**18n) }, // Should have balance/allowance, nonce 1 likely unused
                 { id: 'permit-3', nonce: 256n, owner: ADDRESS_100_BALANCE, tokenAddress: WXDAI_ADDRESS, amount: 10n * (10n**18n) }, // Different wordPos, likely unused
                 { id: 'permit-4', nonce: 0n, owner: ADDRESS_ZERO_BALANCE, tokenAddress: WXDAI_ADDRESS, amount: 1n * (10n**18n) }, // Zero balance owner, nonce 0
                 { id: 'permit-5', nonce: 5n, owner: ADDRESS_100_BALANCE, tokenAddress: WXDAI_ADDRESS, amount: 1000n * (10n**18n) }, // Insufficient balance/allowance likely
                 { id: 'permit-6', nonce: 6n, owner: ADDRESS_100_BALANCE, tokenAddress: WXDAI_ADDRESS, amount: 1n * (10n**18n) },
                 { id: 'permit-7', nonce: 7n, owner: ADDRESS_100_BALANCE, tokenAddress: WXDAI_ADDRESS, amount: 1n * (10n**18n) },
                 { id: 'permit-8', nonce: 8n, owner: ADDRESS_100_BALANCE, tokenAddress: WXDAI_ADDRESS, amount: 1n * (10n**18n) },
            ];

            logOutput(`Simulating ${mockPermits.length} real permit checks on Gnosis (Chain ${permitChainId})...`, 'info');
            logOutput(`(Checking nonceBitmap, balanceOf, allowance)`, 'info');
            logOutput(`(Manager configured with runtimeFailureCooldownMs: ${manager.runtimeFailureCooldownMs || 'Default'})`, 'info');
            logOutput(`(If an RPC fails repeatedly, check console logs for '[Permit2RPC:debug] Skipping recently failed RPC...' messages)`, 'info');

            let overallSuccess = true;
            const summaryLines = [`Permit Check Simulation Results (${mockPermits.length} permits):`];

            // Process permits sequentially to better simulate potential load/failure patterns
            for (const permit of mockPermits) {
                logOutput(`[Sim] >>> Checking ${permit.id} (Nonce: ${permit.nonce})...`, 'debug');
                let permitStatus = 'OK';
                let checkDetails = [];

                try {
                    // 1. Nonce Check
                    const wordPos = BigInt(permit.nonce) >> 8n;
                    const bitPos = 1n << (BigInt(permit.nonce) & 255n);
                    const bitmap = await readContract({
                        manager, chainId: permitChainId, address: PERMIT2_ADDRESS,
                        abi: permit2AbiNonceBitmap, functionName: 'nonceBitmap',
                        args: [permit.owner, wordPos],
                        logger: (level, msg, ...params) => logOutput(`[Sim:${permit.id}:Nonce:${level}] ${msg} ${params.join(' ')}`, level)
                    });
                    const isNonceUsed = (BigInt(bitmap) & bitPos) !== 0n;
                    checkDetails.push(`Nonce Used: ${isNonceUsed}`);
                    if (isNonceUsed) {
                        permitStatus = 'FAIL (Nonce Used)';
                        logOutput(`[Sim:${permit.id}] Nonce ${permit.nonce} already used.`, 'warn');
                        // Continue checking balance/allowance for completeness, but mark as failed
                    }

                    // 2. Balance Check
                    const balance = await readContract({
                        manager, chainId: permitChainId, address: permit.tokenAddress,
                        abi: erc20AbiBalanceOf, functionName: 'balanceOf',
                        args: [permit.owner],
                        logger: (level, msg, ...params) => logOutput(`[Sim:${permit.id}:Balance:${level}] ${msg} ${params.join(' ')}`, level)
                    });
                    const hasEnoughBalance = BigInt(balance) >= BigInt(permit.amount);
                    checkDetails.push(`Balance Sufficient: ${hasEnoughBalance} (Has: ${balance}, Needs: ${permit.amount})`);
                    if (!hasEnoughBalance && permitStatus === 'OK') {
                        permitStatus = 'FAIL (Insufficient Balance)';
                    }

                    // 3. Allowance Check
                    const allowance = await readContract({
                        manager, chainId: permitChainId, address: permit.tokenAddress,
                        abi: erc20AbiAllowance, functionName: 'allowance',
                        args: [permit.owner, PERMIT2_ADDRESS],
                        logger: (level, msg, ...params) => logOutput(`[Sim:${permit.id}:Allowance:${level}] ${msg} ${params.join(' ')}`, level)
                    });
                    const hasEnoughAllowance = BigInt(allowance) >= BigInt(permit.amount);
                    checkDetails.push(`Allowance Sufficient: ${hasEnoughAllowance} (Has: ${allowance}, Needs: ${permit.amount})`);
                     if (!hasEnoughAllowance && permitStatus === 'OK') {
                        permitStatus = 'FAIL (Insufficient Allowance)';
                    }

                } catch (error) {
                    logOutput(`[Sim:${permit.id}] Error during checks: ${error.message}`, 'error');
                    permitStatus = `ERROR (${error.message.substring(0, 50)}...)`; // Mark as error
                }

                summaryLines.push(` - ${permit.id}: ${permitStatus} [${checkDetails.join(', ')}]`);
                if (permitStatus !== 'OK') {
                    overallSuccess = false;
                }
            } // End loop

            logOutput(summaryLines.join('\n'), overallSuccess ? 'success' : 'error');

        });
        // --- End Real Permit Check Simulation ---


        // Load default whitelist on page load
        loadDefaultWhitelist();

    </script>
</body>
</html>
